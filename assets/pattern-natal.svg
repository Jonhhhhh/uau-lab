<svg xmlns="http://www.w3.org/2000/svg" width="340" height="340" viewBox="0 0 340 340">
  <defs>
    <!-- 4-point star -->
    <g id="star">
      <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" />
    </g>
    <!-- snowflake -->
    <g id="snow">
      <line x1="0" y1="-11" x2="0" y2="11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="-11" y1="0" x2="11" y2="0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="-8" y1="8" x2="8" y2="-8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="currentColor"/>
    </g>
    <!-- bokeh blur -->
    <radialGradient id="bokehGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe39b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffe39b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffe39b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokehWhite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft bokeh circles -->
  <circle cx="50" cy="70" r="46" fill="url(#bokehGold)" />
  <circle cx="260" cy="95" r="58" fill="url(#bokehWhite)" />
  <circle cx="150" cy="235" r="50" fill="url(#bokehGold)" />
  <circle cx="300" cy="285" r="42" fill="url(#bokehWhite)" />

  <!-- Gold stars -->
  <g fill="#ffe08b" opacity="0.45">
    <use href="#star" x="85" y="45" transform="scale(0.85)" />
    <use href="#star" x="235" y="170" transform="scale(0.65)" />
    <use href="#star" x="45" y="265" transform="scale(0.75)" />
    <use href="#star" x="310" y="55" transform="scale(0.55)" />
    <use href="#star" x="180" y="305" transform="scale(0.7)" />
  </g>

  <!-- White stars -->
  <g fill="#ffffff" opacity="0.55">
    <use href="#star" x="170" y="75" transform="scale(0.65)" />
    <use href="#star" x="285" y="215" transform="scale(0.72)" />
    <use href="#star" x="110" y="180" transform="scale(0.52)" />
    <use href="#star" x="25" y="130" transform="scale(0.48)" />
  </g>

  <!-- Snowflakes -->
  <g color="#ffffff" opacity="0.38">
    <use href="#snow" x="130" y="115" transform="scale(0.85)" />
    <use href="#snow" x="215" y="255" transform="scale(0.75)" />
    <use href="#snow" x="35" y="200" transform="scale(0.68)" />
    <use href="#snow" x="295" y="130" transform="scale(0.7)" />
    <use href="#snow" x="235" y="35" transform="scale(0.6)" />
  </g>

  <!-- Sparkle dots -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="40" cy="38" r="1.8" />
    <circle cx="205" cy="48" r="2.2" />
    <circle cx="280" cy="18" r="1.5" />
    <circle cx="80" cy="140" r="1.6" />
    <circle cx="160" cy="165" r="2.4" />
    <circle cx="260" cy="145" r="1.8" />
    <circle cx="330" cy="190" r="2" />
    <circle cx="70" cy="225" r="1.8" />
    <circle cx="125" cy="285" r="2.2" />
    <circle cx="245" cy="310" r="1.5" />
    <circle cx="320" cy="250" r="2.2" />
  </g>
  <g fill="#ffe08b" opacity="0.5">
    <circle cx="100" cy="95" r="2.2" />
    <circle cx="185" cy="205" r="1.8" />
    <circle cx="290" cy="80" r="2.4" />
    <circle cx="20" cy="300" r="1.6" />
    <circle cx="195" cy="280" r="2" />
  </g>
</svg>