<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <g id="star4">
      <path d="M 0,-12 Q 0,0 12,0 Q 0,0 0,12 Q 0,0 -12,0 Q 0,0 0,-12 Z" />
    </g>
    <g id="confetti">
      <circle cx="0" cy="0" r="3.2" />
    </g>
    <g id="ribbon">
      <path d="M -8,-6 C -2,-10 4,-2 10,-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
    </g>
    <radialGradient id="glowParty" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb86c" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#ffb86c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffb86c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="60" cy="70" r="48" fill="url(#glowParty)" />
  <circle cx="250" cy="220" r="54" fill="url(#glowParty)" />

  <g fill="#e28743" opacity="0.45">
    <use href="#star4" x="80" y="45" transform="scale(0.85)" />
    <use href="#star4" x="220" y="150" transform="scale(0.7)" />
    <use href="#star4" x="50" y="250" transform="scale(0.8)" />
    <use href="#star4" x="290" y="60" transform="scale(0.65)" />
  </g>

  <g fill="#e5487f" opacity="0.38">
    <use href="#star4" x="160" y="80" transform="scale(0.7)" />
    <use href="#star4" x="270" y="210" transform="scale(0.75)" />
    <use href="#star4" x="110" y="190" transform="scale(0.6)" />
  </g>

  <g color="#e28743" opacity="0.35">
