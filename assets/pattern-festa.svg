  <g fill="#ffffff" opacity="0.75">
    <circle cx="140" cy="55" r="2.2" />
    <circle cx="65" cy="220" r="2.4" />
    <circle cx="230" cy="95" r="2" />
    <circle cx="310" cy="180" r="2.2" />
